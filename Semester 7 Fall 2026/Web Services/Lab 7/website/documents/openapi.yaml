openapi: 3.1.2
info:
  title: Campus Equipment API
  version: 1.0.0
servers:
  - url: http://localhost:8000/api/v1
    description: Change to your local API base URL.
# Complete the response content/schema entries below with references to
# the supplied components. Do not repeat /api/v1 in the paths.
paths:
  /items:
    get:
      summary: List equipment with optional category filtering and two items per page
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [camera, audio, accessory]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 1
      responses:
        '200':
          description: A page ordered by ascending item ID. Add the ItemPage schema.
        '400':
          description: Invalid category or page. Add the Error schema.
    post:
      summary: Add an equipment item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewItem'
            example:
              name: Portable projector
              category: accessory
      responses:
        '201':
          description: Created. Add the Item schema and a Location response header.
        '400':
          description: Invalid input. Add the Error schema.
  /items/{id}:
    get:
      summary: View one item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Found. Add the Item schema.
        '404':
          description: No item with this ID. Add the Error schema.
components:
  schemas:
    NewItem:
      type: object
      required: [name, category]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Trim before storing; a blank name is invalid.
        category:
          type: string
          enum: [camera, audio, accessory]
    Item:
      type: object
      required: [id, name, category]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        category:
          type: string
          enum: [camera, audio, accessory]
    ItemPage:
      type: object
      required: [data, page, pageSize, total]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        page:
          type: integer
          minimum: 1
          maximum: 100
        pageSize:
          type: integer
          const: 2
        total:
          type: integer
          minimum: 0
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
